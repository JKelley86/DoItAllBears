<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#20211f">
  <title>Wedding Command Center</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="viewer-page">
  <header class="viewer-header">
    <a class="round-button" href="index.html" aria-label="Back to weddings">‹</a>
    <div class="viewer-title-wrap">
      <p class="eyebrow">Wedding command center</p>
      <h1 id="documentTitle">Opening planner…</h1>
    </div>
    <button id="openSearch" class="round-button" type="button" aria-label="Search">⌕</button>
  </header>

  <section id="searchDrawer" class="search-drawer" hidden>
    <div class="search-field">
      <input id="pdfSearch" type="search" placeholder="Try: everything about the photographer" autocomplete="off">
      <button id="runSearch" class="solid-button" type="button">Search</button>
    </div>
    <div id="searchStatus" class="search-status">Search the PDF and your notes.</div>
    <div id="searchResults" class="compact-results"></div>
  </section>

  <main class="pdf-stage">
    <div id="loadingState" class="loading-card">
      <div class="spinner"></div>
      <strong>Building your command center</strong>
      <span id="loadingMessage">Reading pages, contacts, schedules, and seating…</span>
    </div>
    <div id="errorState" class="error-card" hidden>
      <strong>Unable to open this planner</strong>
      <p id="errorMessage"></p>
      <a href="index.html" class="solid-button">Back to weddings</a>
    </div>
    <div id="pdfPages" class="pdf-pages"></div>
  </main>

  <nav class="viewer-nav" aria-label="Planner tools">
    <button data-panel="bookmarks" type="button"><span>★</span><small>Pages</small></button>
    <button data-panel="notes" type="button"><span>▤</span><small>Notes</small></button>
    <button data-panel="tasks" type="button"><span>✓</span><small>Tasks</small></button>
    <button data-panel="contacts" type="button"><span>☎</span><small>People</small></button>
    <button data-panel="seating" type="button"><span>⌕</span><small>Guests</small></button>
  </nav>

  <aside id="commandPanel" class="command-panel" hidden>
    <div class="panel-handle"></div>
    <header class="panel-header">
      <div><p class="eyebrow">Damian &amp; Tori</p><h2 id="panelTitle">Quick access</h2></div>
      <button id="closePanel" class="round-button" type="button" aria-label="Close">×</button>
    </header>
    <div id="panelContent" class="panel-content"></div>
  </aside>
  <div id="panelBackdrop" class="panel-backdrop" hidden></div>

  <section id="actionSheet" class="action-sheet" hidden>
    <div class="panel-handle"></div>
    <p class="eyebrow">Page <span id="actionPageNumber"></span></p>
    <h2>Add to this page</h2>
    <div class="action-grid">
      <button data-action="note" type="button"><span>＋</span>Text note</button>
      <button data-action="highlight" type="button"><span>▰</span>Highlight</button>
      <button data-action="check" type="button"><span>✓</span>Checkmark</button>
    </div>
    <label class="field-label" for="bookmarkCategory">Bookmark page as</label>
    <div class="bookmark-row">
      <select id="bookmarkCategory">
        <option value="Schedule">Schedule</option><option value="Contacts">Contacts</option>
        <option value="Ceremony">Ceremony</option><option value="Reception">Reception</option>
        <option value="Vendor information">Vendor information</option><option value="Floor plan">Floor plan</option>
        <option value="Emergency information">Emergency information</option>
      </select>
      <button id="saveBookmark" class="solid-button" type="button">Save</button>
    </div>
    <button id="cancelAction" class="text-button" type="button">Cancel</button>
  </section>
  <div id="actionBackdrop" class="panel-backdrop" hidden></div>

  <div class="viewer-toolbar" aria-label="PDF controls">
    <button id="zoomOut" type="button" aria-label="Zoom out">−</button>
    <span id="zoomLabel">100%</span>
    <button id="zoomIn" type="button" aria-label="Zoom in">＋</button>
    <span class="toolbar-divider"></span>
    <button id="previousPage" type="button" aria-label="Previous page">↑</button>
    <span id="pageIndicator">0 / 0</span>
    <button id="nextPage" type="button" aria-label="Next page">↓</button>
  </div>

  <script type="module" src="viewer.js"></script>
</body>
</html>
