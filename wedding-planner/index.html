<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f0eb">
  <title>Wedding Planners</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="library-page">
  <header class="app-header"><div><p class="eyebrow">Day-of command center</p><h1>Wedding planners</h1><p>Everything important, one tap away.</p></div></header>
  <main class="page-shell">
    <div class="search-field light"><span>⌕</span><input id="plannerSearch" type="search" placeholder="Search weddings…"></div>
    <div class="section-heading"><div><p class="eyebrow">Your weddings</p><h2>Planners</h2></div><span id="plannerCount" class="count-pill">0</span></div>
    <div id="plannerGrid" class="planner-grid"></div>
    <div id="emptyState" class="empty-state" hidden><strong>No planners found</strong><p>Add a PDF or change your search.</p></div>
    <input id="pdfUpload" type="file" accept="application/pdf,.pdf" multiple hidden>
  </main>
  <nav class="bottom-nav">
    <a class="active" href="index.html"><span>▤</span><small>Weddings</small></a>
    <button id="bottomUpload" type="button"><span>＋</span><small>Add PDF</small></button>
  </nav>
  <template id="plannerCardTemplate"><article class="planner-card"><button class="planner-open" type="button"><span class="planner-icon">PDF</span><span class="planner-info"><strong class="planner-name"></strong><span class="planner-meta"></span></span><span class="chevron">›</span></button><button class="planner-delete" type="button" aria-label="Remove" hidden>×</button></article></template>
  <script src="planners.js"></script>
</body>
</html>
